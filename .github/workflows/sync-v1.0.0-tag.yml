name: One-time - finalize v1.0.0 source archives

# Run manually from Actions on the main branch. Nothing runs on push.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoABC-one-time-v1.0.0-tag
  cancel-in-progress: false

jobs:
  sync-tag:
    name: Move v1.0.0 to the current main commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main and tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and update only the v1.0.0 tag
        shell: bash
        env:
          EXPECTED_OLD_TAG_SHA: 50c894de9c18ada58904618275baf09f8092280d
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Select main in the Run workflow menu."
            exit 1
          fi

          target="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$live_main" || "$target" != "$live_main" ]]; then
            echo "::error::main changed during the workflow. Run again after reviewing."
            exit 1
          fi

          current="$(git ls-remote origin refs/tags/v1.0.0 | awk '{print $1}')"
          if [[ "$current" == "$target" ]]; then
            echo "v1.0.0 already points to current main; nothing changed."
            exit 0
          fi
          if [[ "$current" != "$EXPECTED_OLD_TAG_SHA" ]]; then
            echo "::error::v1.0.0 changed unexpectedly; refusing to move it."
            echo "Current tag: $current"
            exit 1
          fi

          git tag -f v1.0.0 "$target"
          git push \
            --force-with-lease="refs/tags/v1.0.0:$EXPECTED_OLD_TAG_SHA" \
            origin refs/tags/v1.0.0:refs/tags/v1.0.0

          updated="$(git ls-remote origin refs/tags/v1.0.0 | awk '{print $1}')"
          if [[ "$updated" != "$target" ]]; then
            echo "::error::The remote tag was not updated to the selected main commit."
            exit 1
          fi

          echo "Success: v1.0.0 now points to $updated"
          echo "Release ZIP attachments and SHA256SUMS were not modified."
